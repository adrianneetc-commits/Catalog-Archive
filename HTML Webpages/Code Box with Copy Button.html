<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Box with Copy Button</title>
  <style>
    :root {
      --bg-color: #1e1e1e;
      --header-bg: #2d2d2d;
      --text-color: #d4d4d4;
      --btn-bg: #3c3c3c;
      --btn-hover: #4c4c4c;
      --accent-color: #4ec9b0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Container for the code block */
    .code-container {
      width: 100%;
      max-width: 650px;
      background-color: var(--bg-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid #333;
    }

    /* Header styling containing language label and copy button */
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--header-bg);
      padding: 8px 16px;
      font-size: 13px;
      color: #888;
    }

    /* Copy Button */
    .copy-btn {
      background-color: var(--btn-bg);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: var(--btn-hover);
    }

    /* Code block styling */
    pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
    }

    code {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 14px;
      color: var(--text-color);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="code-container">
    <div class="code-header">
      <span>JavaScript</span>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">
        <svg id="copyIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="btnText">Copy</span>
      </button>
    </div>
    <pre><code id="codeBlock">function greet(name) {
  console.log(`Hello, ${name}!`);
}

greet('World');</code></pre>
  </div>

  <script>
    async function copyCode() {
      const codeText = document.getElementById('codeBlock').innerText;
      const btnText = document.getElementById('btnText');
      const copyBtn = document.getElementById('copyBtn');

      try {
        await navigator.clipboard.writeText(codeText);

        btnText.innerText = 'Copied!';
        copyBtn.style.color = '#4ec9b0';

        setTimeout(() => {
          btnText.innerText = 'Copy';
          copyBtn.style.color = '#fff';
        }, 2000);
      } catch (err) {
        console.error('Failed to copy text: ', err);
        btnText.innerText = 'Failed';
      }
    }
  </script>

</body>
</html>
