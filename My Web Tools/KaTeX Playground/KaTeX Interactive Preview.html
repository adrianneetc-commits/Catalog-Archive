<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeX Interactive Preview</title>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <!-- Inter Font & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    boxShadow: {
                        'pill': '0 8px 30px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04)',
                        'pill-hover': '0 12px 35px rgba(99, 102, 241, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
    <!-- KaTeX JS & Auto-render extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
        /* Custom scrollbars */
        textarea::-webkit-scrollbar, .katex-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        textarea::-webkit-scrollbar-thumb, .katex-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .katex-display {
            margin: 0 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 antialiased">

    <div class="max-w-3xl w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-600 text-xs font-semibold tracking-wide uppercase">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                KaTeX Playground
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Interactive Formula Editor</h1>
            <p class="text-slate-500 text-sm max-w-md mx-auto">Render fast, crisp mathematical expressions using KaTeX syntax with real-time feedback.</p>
        </div>

        <!-- Presets -->
        <div class="flex items-center justify-between bg-white p-2.5 rounded-2xl border border-slate-200/80 shadow-sm text-xs gap-2 overflow-x-auto">
            <span class="font-medium text-slate-400 pl-2 shrink-0">Presets:</span>
            <div class="flex items-center gap-1.5 overflow-x-auto">
                <button onclick="loadPreset('dependencies')" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 font-medium hover:bg-indigo-100 transition-colors shrink-0">
                    Dependencies
                </button>
                <button onclick="loadPreset('quadratic')" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-colors shrink-0">
                    Quadratic Formula
                </button>
                <button onclick="loadPreset('matrix')" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-colors shrink-0">
                    Matrix
                </button>
                <button onclick="loadPreset('integral')" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition-colors shrink-0">
                    Definite Integral
                </button>
            </div>
        </div>

        <!-- Editor Card -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-4">
            
            <div class="flex items-center justify-between">
                <label for="latex-input" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <span>LaTeX Source</span>
                    <span id="error-badge" class="hidden px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200 text-[10px] lowercase font-normal">Syntax Error</span>
                </label>
                
                <!-- Toggle Mode -->
                <label class="inline-flex items-center cursor-pointer gap-2">
                    <span class="text-xs text-slate-500 font-medium">Auto-render</span>
                    <input type="checkbox" id="auto-render-toggle" class="sr-only peer" checked>
                    <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>

            <div class="relative">
                <textarea 
                    id="latex-input" 
                    rows="4" 
                    class="w-full font-mono text-sm bg-slate-50 border border-slate-200 rounded-2xl p-4 text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"
                    placeholder="Enter LaTeX formula here..."
                    spellcheck="false"
                ></textarea>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between pt-1">
                <button 
                    onclick="clearInput()" 
                    class="text-xs text-slate-400 hover:text-slate-600 font-medium transition-colors px-2 py-1"
                >
                    Clear Input
                </button>

                <div class="flex items-center gap-3">
                    <button 
                        id="render-btn"
                        onclick="renderMath()" 
                        class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium text-sm transition-all shadow-md shadow-indigo-600/20 flex items-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>Render Math</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pill Preview Container -->
        <div class="space-y-3">
            <div class="flex items-center justify-between px-2">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Pill Preview</span>
                <span class="text-xs text-slate-400">KaTeX v0.16.11</span>
            </div>

            <div class="flex justify-center">
                <div class="group relative max-w-full">
                    <!-- Pill Display -->
                    <div id="pill-container" class="inline-flex items-center gap-4 bg-white px-8 py-5 rounded-full border border-slate-200/90 shadow-pill hover:shadow-pill-hover transition-all duration-300 min-h-[72px] min-w-[200px] justify-center">
                        <div id="katex-output" class="katex-scroll overflow-x-auto text-slate-900 text-lg sm:text-xl py-1 px-2"></div>
                    </div>

                    <!-- Floating Copy Action Pill -->
                    <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-200 transform translate-y-1 group-hover:translate-y-0 flex items-center gap-1 bg-slate-900/90 backdrop-blur text-white text-xs px-3 py-1.5 rounded-full shadow-lg">
                        <button onclick="copyToClipboard('latex')" class="px-2 py-0.5 hover:text-indigo-300 font-medium transition-colors">Copy LaTeX</button>
                        <span class="text-slate-600">•</span>
                        <button onclick="copyToClipboard('html')" class="px-2 py-0.5 hover:text-indigo-300 font-medium transition-colors">Copy HTML</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span id="toast-msg">Copied to clipboard!</span>
        </div>

    </div>

    <script>
        const presets = {
            dependencies: `\\text{Dependencies}: \\quad \\mathbf{D}(x) = \\sum_{i=1}^{n} w_i \\cdot f(x_i) \\implies \\mathcal{O}(n \\log n)`,
            quadratic: `x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}`,
            matrix: `\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}^{-1} = \\frac{1}{ad-bc} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}`,
            integral: `\\int_{a}^{b} x^2 \\,dx = \\left[ \\frac{x^3}{3} \\right]_a^b = \\frac{b^3 - a^3}{3}`
        };

        const input = document.getElementById('latex-input');
        const output = document.getElementById('katex-output');
        const errorBadge = document.getElementById('error-badge');
        const autoRenderToggle = document.getElementById('auto-render-toggle');

        function renderMath() {
            const val = input.value.trim();
            errorBadge.classList.add('hidden');

            if (!val) {
                output.innerHTML = '<span class="text-slate-300 text-sm font-sans italic">Nothing to preview</span>';
                return;
            }

            try {
                katex.render(val, output, {
                    displayMode: true,
                    throwOnError: true,
                    output: 'html'
                });
            } catch (err) {
                errorBadge.classList.remove('hidden');
                // Optional fallback render without throwing
                try {
                    katex.render(val, output, {
                        displayMode: true,
                        throwOnError: false
                    });
                } catch (e) {
                    output.innerHTML = `<span class="text-rose-500 text-xs font-mono">${err.message}</span>`;
                }
            }
        }

        function loadPreset(key) {
            if (presets[key]) {
                input.value = presets[key];
                renderMath();
            }
        }

        function clearInput() {
            input.value = '';
            renderMath();
            input.focus();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
            }, 2500);
        }

        function copyToClipboard(type) {
            let content = '';
            if (type === 'latex') {
                content = input.value;
            } else if (type === 'html') {
                content = output.innerHTML;
            }

            if (!content) return;

            navigator.clipboard.writeText(content).then(() => {
                showToast(`Copied ${type.toUpperCase()}!`);
            });
        }

        // Live rendering on typing if toggle is active
        input.addEventListener('input', () => {
            if (autoRenderToggle.checked) {
                renderMath();
            }
        });

        // Initialize default formula
        window.addEventListener('DOMContentLoaded', () => {
            loadPreset('dependencies');
        });
    </script>
</body>
</html>
